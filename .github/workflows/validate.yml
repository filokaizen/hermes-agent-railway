name: Validate Telegram Serverless changes

on:
  push:
    branches: [feature/telegram-serverless]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m py_compile server.py
      - name: Validate webhook routing and configuration safety
        run: python -m unittest discover -s tests -v
